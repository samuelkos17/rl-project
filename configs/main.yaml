# The full 260-run matrix: 13 environment instances x 4 strategies x 5 seeds.
defaults:
  # Both confirmed by task 2's benchmark on 2026-08-17, not assumed.
  # CPU 630 steps/s vs CUDA 550 steps/s on an RTX 3060 Ti -- the GPU is slower
  # for a network this small. See docs/decision_log.md.
  total_steps: 400000
  device: cpu
  results_root: results

env_ids:
  - Empty-5
  - Empty-8
  - Empty-16
  - DoorKey-5
  - DoorKey-6
  - DoorKey-7
  - DoorKey-8
  - DoorKey-10
  - MultiRoom-N2
  - MultiRoom-N3
  - MultiRoom-N4
  - MultiRoom-N5
  - MultiRoom-N6

strategies:
  - epsilon_greedy
  - boltzmann
  - count_based
  - noisy

seeds: [0, 1, 2, 3, 4]
